<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Map - Belknap Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            complete: '#22C55E',
            incomplete: '#EF4444',
            location: '#3B82F6',
          }
        }
      }
    }
  </script>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-100 font-[-apple-system,BlinkMacSystemFont,'Segoe_UI',Roboto,sans-serif]">

  <!-- Map Container -->
  <div class="absolute inset-0 bottom-16 bg-gradient-to-br from-slate-200 to-slate-300">
    <!-- Simulated map -->
    <svg class="w-full h-full" viewBox="0 0 375 600" preserveAspectRatio="xMidYMid slice">
      <!-- Incomplete trails -->
      <path d="M50,180 Q150,160 200,230 T300,280" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M80,330 Q180,300 250,380" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M200,130 Q280,180 320,160" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M100,430 Q200,400 280,460" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- Complete trails -->
      <path d="M120,260 Q200,240 260,300 T340,360" stroke="#22C55E" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M60,360 Q140,330 180,380" stroke="#22C55E" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M280,200 Q320,260 350,240" stroke="#22C55E" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M150,480 Q220,450 260,500" stroke="#22C55E" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- User location -->
      <circle cx="200" cy="300" r="24" fill="#3B82F6" opacity="0.2"/>
      <circle cx="200" cy="300" r="12" fill="#3B82F6"/>
      <circle cx="200" cy="300" r="6" fill="white"/>
    </svg>
  </div>

  <!-- Header Overlay -->
  <div class="absolute top-0 left-0 right-0 bg-gradient-to-b from-white/90 to-transparent pt-3 pb-8 px-4">
    <div class="flex items-center justify-between">
      <h1 class="text-lg font-semibold text-slate-800">Trail Map</h1>
      <div class="flex gap-2">
        <button class="px-3 py-1.5 bg-white rounded-full shadow text-xs font-medium text-slate-600 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-complete"></span>
          4 Done
        </button>
        <button class="px-3 py-1.5 bg-white rounded-full shadow text-xs font-medium text-slate-600 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-incomplete"></span>
          4 Left
        </button>
      </div>
    </div>
  </div>

  <!-- Map Controls -->
  <div class="absolute right-4 top-20 flex flex-col gap-2">
    <button class="w-11 h-11 bg-white rounded-lg shadow-lg flex items-center justify-center text-slate-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v12M6 12h12"/>
      </svg>
    </button>
    <button class="w-11 h-11 bg-white rounded-lg shadow-lg flex items-center justify-center text-slate-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
      </svg>
    </button>
    <button class="w-11 h-11 bg-white rounded-lg shadow-lg flex items-center justify-center text-location">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
      </svg>
    </button>
  </div>

  <!-- Trail Popup -->
  <div id="trail-popup" class="absolute bottom-20 left-4 right-4 bg-white rounded-xl shadow-xl p-4 hidden">
    <div class="flex items-start justify-between">
      <div>
        <h3 class="font-semibold text-lg text-slate-800">Mount Belknap via East Trail</h3>
        <p class="text-sm text-slate-500 mt-1">2.4 mi &bull; Moderate &bull; 1,200 ft</p>
      </div>
      <button onclick="closePopup()" class="w-8 h-8 flex items-center justify-center text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="flex gap-3 mt-4">
      <a href="trail-detail.html" class="flex-1 py-2.5 border border-slate-300 rounded-lg text-center text-sm font-medium text-slate-700">
        Details
      </a>
      <button onclick="showCompleteModal()" class="flex-1 py-2.5 bg-complete text-white rounded-lg text-center text-sm font-medium">
        Mark Complete
      </button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around">
    <a href="index.html" class="flex flex-col items-center py-1 px-3 text-slate-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <span class="text-xs mt-1">Home</span>
    </a>
    <a href="map.html" class="flex flex-col items-center py-1 px-3 text-location">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="text-xs font-medium mt-1">Map</span>
    </a>
    <a href="trails.html" class="flex flex-col items-center py-1 px-3 text-slate-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
      </svg>
      <span class="text-xs mt-1">Trails</span>
    </a>
    <a href="settings.html" class="flex flex-col items-center py-1 px-3 text-slate-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span class="text-xs mt-1">Settings</span>
    </a>
  </nav>

  <!-- Completion Modal -->
  <div id="complete-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-end justify-center">
    <div class="bg-white w-full rounded-t-2xl p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold text-slate-800">Mark Complete</h2>
        <button onclick="closeCompleteModal()" class="w-10 h-10 flex items-center justify-center text-slate-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="mb-6">
        <div class="font-medium text-slate-800">Mount Belknap via East Trail</div>
        <div class="text-sm text-slate-500">2.4 mi &bull; Moderate</div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-2">Date Completed</label>
        <input type="date" value="2025-12-20" class="w-full px-4 py-3 border border-slate-300 rounded-lg">
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-2">Notes (optional)</label>
        <textarea rows="3" placeholder="How was the hike?" class="w-full px-4 py-3 border border-slate-300 rounded-lg resize-none"></textarea>
      </div>

      <div class="flex gap-3">
        <button onclick="closeCompleteModal()" class="flex-1 py-3 border border-slate-300 rounded-lg font-medium text-slate-700">
          Cancel
        </button>
        <button onclick="closeCompleteModal()" class="flex-1 py-3 bg-complete text-white rounded-lg font-medium flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Save
        </button>
      </div>
    </div>
  </div>

  <script>
    function closePopup() {
      document.getElementById('trail-popup').classList.add('hidden');
    }
    function showPopup() {
      document.getElementById('trail-popup').classList.remove('hidden');
    }
    function showCompleteModal() {
      closePopup();
      const modal = document.getElementById('complete-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
    function closeCompleteModal() {
      const modal = document.getElementById('complete-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Click map to show popup
    document.querySelector('svg').addEventListener('click', function(e) {
      if (!e.target.closest('#trail-popup')) {
        showPopup();
      }
    });
  </script>
</body>
</html>
