<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <!-- Background -->
  <rect width="2732" height="2732" fill="#3B82F6"/>

  <!-- Centered app icon (scaled down) -->
  <g transform="translate(866, 866)">
    <!-- Mountain outline -->
    <path
      d="M500 100 L900 700 H100 Z"
      fill="none"
      stroke="white"
      stroke-width="32"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Secondary peak -->
    <path
      d="M240 700 L400 450 L560 700"
      fill="none"
      stroke="white"
      stroke-width="20"
      stroke-linejoin="round"
      stroke-linecap="round"
      opacity="0.7"
    />

    <!-- Red trail line -->
    <path
      d="M180 660 Q350 500 500 420 Q650 340 820 260"
      fill="none"
      stroke="#DC2626"
      stroke-width="24"
      stroke-linecap="round"
      stroke-dasharray="8 20"
    />

    <!-- Location marker -->
    <circle cx="500" cy="420" r="44" fill="#22C55E"/>
    <circle cx="500" cy="420" r="18" fill="white"/>
  </g>

  <!-- App name -->
  <text
    x="1366"
    y="2200"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="120"
    font-weight="600"
    fill="white"
  >
    Belknap Tracker
  </text>
</svg>
