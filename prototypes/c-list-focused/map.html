<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Map - Belknap Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            complete: '#22C55E',
            incomplete: '#EF4444',
            location: '#3B82F6',
          }
        }
      }
    }
  </script>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-100 font-[-apple-system,BlinkMacSystemFont,'Segoe_UI',Roboto,sans-serif]">

  <!-- Minimal Header -->
  <header class="absolute top-0 left-0 right-0 z-10 p-3 flex justify-between">
    <a href="index.html" class="w-10 h-10 bg-white rounded-full shadow flex items-center justify-center text-slate-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>

    <!-- Legend -->
    <div class="bg-white rounded-full shadow px-3 py-2 flex items-center gap-3 text-xs">
      <span class="flex items-center gap-1">
        <span class="w-3 h-0.5 bg-complete rounded-full"></span>
        Done (4)
      </span>
      <span class="flex items-center gap-1">
        <span class="w-3 h-0.5 bg-incomplete rounded-full"></span>
        Left (4)
      </span>
    </div>
  </header>

  <!-- Map -->
  <div class="absolute inset-0 bg-gradient-to-br from-slate-200 to-slate-300">
    <svg class="w-full h-full" viewBox="0 0 375 667" preserveAspectRatio="xMidYMid slice">
      <!-- Incomplete -->
      <path d="M50,200 Q150,180 200,250 T300,300" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M80,350 Q180,320 250,400" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M200,150 Q280,200 320,180" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M100,450 Q200,420 280,480" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- Complete -->
      <path d="M120,280 Q200,260 260,320 T340,380" stroke="#22C55E" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M60,380 Q140,350 180,400" stroke="#22C55E" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M280,220 Q320,280 350,260" stroke="#22C55E" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M150,500 Q220,470 260,520" stroke="#22C55E" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- User -->
      <circle cx="200" cy="320" r="20" fill="#3B82F6" opacity="0.2"/>
      <circle cx="200" cy="320" r="10" fill="#3B82F6"/>
      <circle cx="200" cy="320" r="5" fill="white"/>
    </svg>
  </div>

  <!-- Controls -->
  <div class="absolute right-3 top-1/3 flex flex-col gap-1.5">
    <button class="w-9 h-9 bg-white rounded-lg shadow flex items-center justify-center text-slate-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v12M6 12h12"/>
      </svg>
    </button>
    <button class="w-9 h-9 bg-white rounded-lg shadow flex items-center justify-center text-slate-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
      </svg>
    </button>
    <button class="w-9 h-9 bg-white rounded-lg shadow flex items-center justify-center text-location">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
      </svg>
    </button>
  </div>

  <!-- Selected Trail Card -->
  <div id="trail-card" class="absolute bottom-4 left-3 right-3 bg-white rounded-xl shadow-lg p-3 hidden">
    <div class="flex items-center gap-3">
      <button onclick="toggleFromMap()" class="w-8 h-8 flex items-center justify-center">
        <div class="w-5 h-5 border-2 border-slate-300 rounded"></div>
      </button>
      <a href="trail-detail.html" class="flex-1 min-w-0">
        <div class="font-medium text-slate-800 text-sm">Gunstock Mountain</div>
        <div class="text-xs text-slate-500">3.2 mi &bull; Moderate &bull; 1,400 ft</div>
      </a>
      <button onclick="closeCard()" class="text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    function closeCard() {
      document.getElementById('trail-card').classList.add('hidden');
    }
    function showCard() {
      document.getElementById('trail-card').classList.remove('hidden');
    }
    function toggleFromMap() {
      // Would show date picker
      alert('Quick complete from map!');
    }

    document.querySelector('svg').addEventListener('click', showCard);
  </script>
</body>
</html>
