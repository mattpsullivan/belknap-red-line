<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Settings - Belknap Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            complete: '#22C55E',
            incomplete: '#EF4444',
            location: '#3B82F6',
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-white font-[-apple-system,BlinkMacSystemFont,'Segoe_UI',Roboto,sans-serif]">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="flex items-center h-12 px-3">
      <a href="index.html" class="w-9 h-9 flex items-center justify-center -ml-1 text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </a>
      <h1 class="text-base font-semibold text-slate-800">Settings</h1>
    </div>
  </header>

  <main class="divide-y divide-slate-200">
    <!-- Data Section -->
    <div class="px-4 py-3">
      <div class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2">Data</div>
      <div class="space-y-1">
        <button class="w-full flex items-center justify-between py-2.5 text-left">
          <span class="text-sm text-slate-800">Export Data (JSON)</span>
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
        </button>
        <button class="w-full flex items-center justify-between py-2.5 text-left">
          <span class="text-sm text-slate-800">Export Data (CSV)</span>
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
        </button>
        <button class="w-full flex items-center justify-between py-2.5 text-left">
          <span class="text-sm text-slate-800">Import Data</span>
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Danger Zone -->
    <div class="px-4 py-3">
      <div class="text-xs font-medium text-red-500 uppercase tracking-wide mb-2">Danger Zone</div>
      <button onclick="showClearModal()" class="w-full flex items-center justify-between py-2.5 text-left">
        <span class="text-sm text-red-600">Clear All Data</span>
        <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>

    <!-- About -->
    <div class="px-4 py-3">
      <div class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2">About</div>
      <div class="space-y-1">
        <div class="flex items-center justify-between py-2">
          <span class="text-sm text-slate-600">Version</span>
          <span class="text-sm text-slate-800">1.0.0</span>
        </div>
        <a href="#" class="flex items-center justify-between py-2.5">
          <span class="text-sm text-slate-800">BRATTS Redlining Program</span>
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
        </a>
        <a href="#" class="flex items-center justify-between py-2.5">
          <span class="text-sm text-slate-800">Send Feedback</span>
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- Stats Summary -->
    <div class="px-4 py-4">
      <div class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-3">Your Stats</div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-50 rounded-lg p-3">
          <div class="text-xl font-bold text-slate-800">4</div>
          <div class="text-xs text-slate-500">Trails Completed</div>
        </div>
        <div class="bg-slate-50 rounded-lg p-3">
          <div class="text-xl font-bold text-slate-800">10.5</div>
          <div class="text-xs text-slate-500">Miles Hiked</div>
        </div>
        <div class="bg-slate-50 rounded-lg p-3">
          <div class="text-xl font-bold text-slate-800">50%</div>
          <div class="text-xs text-slate-500">Progress</div>
        </div>
        <div class="bg-slate-50 rounded-lg p-3">
          <div class="text-xl font-bold text-slate-800">4</div>
          <div class="text-xs text-slate-500">Days Active</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Clear Data Modal -->
  <div id="clear-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-xl p-4">
      <div class="text-center mb-4">
        <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3">
          <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
        <h2 class="font-semibold text-slate-800">Clear All Data?</h2>
        <p class="text-sm text-slate-500 mt-1">This will delete all your completions and cannot be undone.</p>
      </div>
      <div class="flex gap-2">
        <button onclick="closeClearModal()" class="flex-1 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600">Cancel</button>
        <button onclick="closeClearModal()" class="flex-1 py-2 bg-red-600 text-white rounded-lg text-sm font-medium">Clear</button>
      </div>
    </div>
  </div>

  <script>
    function showClearModal() {
      document.getElementById('clear-modal').classList.remove('hidden');
      document.getElementById('clear-modal').classList.add('flex');
    }
    function closeClearModal() {
      document.getElementById('clear-modal').classList.add('hidden');
      document.getElementById('clear-modal').classList.remove('flex');
    }
  </script>
</body>
</html>
